<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <!-- Outer Pentagon Shield Body -->
  <polygon points="250,15 475,175 410,475 90,475 25,175" fill="#1CA8EC" stroke="#111111" stroke-width="6" stroke-linejoin="round" />

  <!-- Arched Text "S M A" at Top -->
  <path id="smaArc" d="M 120,105 Q 250,30 380,105" fill="none" />
  <text font-family="'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#FFD700" stroke="#000000" stroke-width="2" text-anchor="middle">
    <textPath href="#smaArc" startOffset="50%">S M A</textPath>
  </text>

  <!-- Left Rice Stalk (Padi) -->
  <g fill="#FFD700" stroke="#B8860B" stroke-width="1.5">
    <path d="M 85,420 C 70,300 130,200 190,170" fill="none" stroke="#DAA520" stroke-width="3" />
    <ellipse cx="90" cy="400" rx="14" ry="7" transform="rotate(-30 90 400)" />
    <ellipse cx="82" cy="365" rx="14" ry="7" transform="rotate(-25 82 365)" />
    <ellipse cx="82" cy="330" rx="14" ry="7" transform="rotate(-15 82 330)" />
    <ellipse cx="90" cy="295" rx="14" ry="7" transform="rotate(-5 90 295)" />
    <ellipse cx="104" cy="260" rx="14" ry="7" transform="rotate(10 104 260)" />
    <ellipse cx="124" cy="230" rx="14" ry="7" transform="rotate(25 124 230)" />
    <ellipse cx="150" cy="202" rx="14" ry="7" transform="rotate(40 150 202)" />
    <ellipse cx="178" cy="182" rx="14" ry="7" transform="rotate(55 178 182)" />
  </g>

  <!-- Right Cotton Branch (Kapas) -->
  <g fill="#FFFFFF" stroke="#005522" stroke-width="2">
    <path d="M 415,420 C 430,300 370,200 310,170" fill="none" stroke="#008844" stroke-width="3" />
    <g transform="translate(410, 395)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(418, 360)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(418, 325)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(410, 290)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(396, 255)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(376, 225)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(350, 198)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
    <g transform="translate(322, 178)"><circle cx="0" cy="0" r="11" fill="#FFFFFF" /><path d="M-6,4 Q0,11 6,4 Q0,-2 -6,4" fill="#009944" /></g>
  </g>

  <!-- Golden Wings (Sayap) -->
  <g fill="#FFD700" stroke="#000000" stroke-width="2">
    <!-- Left Wing -->
    <path d="M 250,280 C 200,220 120,200 135,320 C 160,335 210,310 250,325 Z" />
    <path d="M 250,295 C 190,245 130,230 145,330 C 170,340 215,320 250,335 Z" fill="#FFE000" />
    <path d="M 250,310 C 200,270 145,260 160,340 C 180,345 220,330 250,345 Z" fill="#FFF066" />

    <!-- Right Wing -->
    <path d="M 250,280 C 300,220 380,200 365,320 C 340,335 290,310 250,325 Z" />
    <path d="M 250,295 C 310,245 370,230 355,330 C 330,340 285,320 250,335 Z" fill="#FFE000" />
    <path d="M 250,310 C 300,270 355,260 340,340 C 320,345 280,330 250,345 Z" fill="#FFF066" />
  </g>

  <!-- Torch Flame (Obor) -->
  <g transform="translate(250, 205)">
    <!-- Red Flame -->
    <path d="M 0,-85 C 20,-60 30,-35 15,-15 C 25,-40 5,-60 0,-85 Z" fill="#FF2200" stroke="#990000" stroke-width="1.5" />
    <path d="M 0,-85 C -20,-60 -30,-35 -15,-15 C -25,-40 -5,-60 0,-85 Z" fill="#ED1C24" stroke="#990000" stroke-width="1.5" />
    <path d="M 0,-70 C 12,-50 15,-30 0,-15 C -15,-30 -12,-50 0,-70 Z" fill="#FF9900" />
    <path d="M 0,-55 C 6,-40 8,-25 0,-15 C -8,-25 -6,-40 0,-55 Z" fill="#FFE600" />

    <!-- Torch Cup Handle -->
    <path d="M -16,-15 L 16,-15 L 10,12 L -10,12 Z" fill="#FFD700" stroke="#000000" stroke-width="2" />
    <line x1="-16" y1="-15" x2="16" y2="-15" stroke="#000000" stroke-width="3" />
    <path d="M -12,0 L 12,0" stroke="#B8860B" stroke-width="2" />
  </g>

  <!-- Center White Oval with Roman Numeral "XVII" -->
  <g transform="translate(250, 275)">
    <ellipse cx="0" cy="0" rx="20" ry="34" fill="#FFFFFF" stroke="#ED1C24" stroke-width="3" />
    <text x="0" y="10" font-family="'Times New Roman', serif" font-weight="900" font-size="22" fill="#ED1C24" text-anchor="middle">XVII</text>
  </g>

  <!-- Open Book at Bottom Center -->
  <g transform="translate(250, 385)">
    <!-- Pages -->
    <path d="M 0,-15 Q -40,-30 -90,-20 L -90,20 Q -40,10 0,25 Q 40,10 90,20 L 90,-20 Q 40,-30 0,-15 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    <path d="M 0,-15 L 0,25" stroke="#000000" stroke-width="2" />
    <!-- Page Lines -->
    <path d="M -15,-10 Q -45,-20 -80,-12" fill="none" stroke="#333333" stroke-width="1.5" />
    <path d="M -15,0 Q -45,-10 -80,-2" fill="none" stroke="#333333" stroke-width="1.5" />
    <path d="M -15,10 Q -45,0 -80,8" fill="none" stroke="#333333" stroke-width="1.5" />
    <path d="M 15,-10 Q 45,-20 80,-12" fill="none" stroke="#333333" stroke-width="1.5" />
    <path d="M 15,0 Q 45,-10 80,-2" fill="none" stroke="#333333" stroke-width="1.5" />
    <path d="M 15,10 Q 45,0 80,8" fill="none" stroke="#333333" stroke-width="1.5" />
  </g>

  <!-- Bottom White Ribbon Banner "17 KONAWE" -->
  <g transform="translate(250, 445)">
    <!-- Ribbon Shadow Fold Ends -->
    <polygon points="-190,-10 -150,-22 -150,15 -180,22" fill="#111111" />
    <polygon points="190,-10 150,-22 150,15 180,22" fill="#111111" />

    <!-- Ribbon Main Body -->
    <path d="M -160,-20 Q 0,-32 160,-20 L 150,18 Q 0,8 -150,18 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />
    
    <!-- Ribbon Text -->
    <text x="0" y="3" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ED1C24" text-anchor="middle">17 KONAWE</text>
  </g>
</svg>